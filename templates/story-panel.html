<style>
:root{--paper:#f5f1e8;--ink:#302f2c;--rust:#a64032}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
#deck-container{position:fixed!important;left:0;top:0;width:100vw!important;height:100vh!important}
#map-heading{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:560px;max-width:calc(100vw - 28px);text-align:center;padding:7px 17px 6px;background:#f5f1e8f2;border:1px solid #dfd8cd;border-radius:3px;z-index:5}
h1{font:normal 35px/1.08 Georgia,'Times New Roman',serif;letter-spacing:-.045em;margin:0;color:#302f2c}h1 em{font-weight:normal;color:var(--rust)}.scope-period{font-size:10px;line-height:1.4;letter-spacing:.015em;margin:4px 0 0;color:#3f423d;font-weight:500}.symbol-key{display:flex;justify-content:center;align-items:center;gap:6px;font-size:10px;line-height:1.4;color:#67665e;margin-top:6px}.symbol-key img{width:12px;height:15px}
.source-credit,.map-credit{position:fixed;bottom:0;z-index:10;background:#f5f1e8f0;padding:4px 8px;font:10px/1.5 system-ui,sans-serif;color:#65665f}.source-credit{left:0}.map-credit{right:0}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
@media(max-width:700px){#map-heading{top:8px;padding:7px 10px 5px}h1{font-size:28px}.scope-period{font-size:10px}.source-credit,.map-credit{font-size:9px}.source-credit{bottom:21px;max-width:100vw}}
</style>
<header id="map-heading">
<h1>Someone Was <em>Walking Here.</em></h1>
<p class="scope-period">$count fatal pedestrian crashes · City &amp; County of Denver · $period</p>
<div class="symbol-key"><img src="$icon" alt="Walking-person symbol">One symbol = one fatal crash</div>
</header>
<div class="source-credit">Source: <a href="https://opendata-geospatialdenver.hub.arcgis.com/">Denver Open Data</a> · <a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a></div>
<div class="map-credit"><a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a></div>
