<style>
:root{--paper:#f5f1e8;--ink:#24343c;--teal:#087f8c;--rust:#bb3f30}
*{box-sizing:border-box}body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
#deck-container{position:fixed!important;left:0;top:0;width:100vw!important;height:100vh!important}
#map-heading{position:fixed;top:8px;left:50%;transform:translateX(-50%);width:600px;max-width:calc(100vw - 32px);text-align:center;padding:10px 18px;background:#f5f1e8f2;border:1px solid #dcd7cd;border-radius:4px;z-index:5;box-shadow:0 2px 10px #24343c08}
h1{font-size:21px;line-height:1.2;letter-spacing:-.025em;font-weight:650;margin:0;color:var(--ink)}.scope-period{font-size:11px;line-height:1.35;font-weight:450;letter-spacing:0;margin:5px 0 0;color:#526168}
.map-controls{display:flex;justify-content:center;align-items:center;gap:24px;margin-top:9px;flex-wrap:wrap}.legend{display:flex;justify-content:center;gap:20px;font-size:12px;line-height:1.5;color:var(--ink)}.legend span{display:inline-flex;align-items:center;gap:6px}.dot{display:inline-block;border-radius:50%;border:0.65px solid #fffffff0}.dot.fatal{width:15px;height:15px;background:var(--rust)}.dot.serious{width:9px;height:9px;background:var(--teal)}
.mode-filter{font:11px/1.5 system-ui,sans-serif;color:var(--ink);background:transparent;border:1px solid #d4d0c6;border-radius:3px;padding:2px 5px;max-width:145px}.mode-filter:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.source-credit,.map-credit{position:fixed;bottom:0;z-index:10;background:#fffffff0;padding:4px 8px;font:10px/1.5 system-ui,sans-serif;color:#657077}.source-credit{left:0}.map-credit{right:0}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
@media(max-width:700px){#map-heading{top:8px;max-width:calc(100vw - 20px);padding:9px 12px}h1{font-size:18px}.scope-period{font-size:10px}.map-controls{gap:12px;margin-top:8px}.legend{font-size:11px;gap:14px}.mode-filter{font-size:10px}.source-credit,.map-credit{font-size:9px}.source-credit{bottom:21px;max-width:100vw}}
</style>
<header id="map-heading">
<h1>Pedestrian &amp; Bicycle Crash Locations in Denver</h1>
<p class="scope-period" id="map-scope" data-period="$period">Crashes resulting in fatal or serious injury · $period</p>
<div class="map-controls">
<div class="legend" aria-label="Crash severity legend">
<span><i class="dot fatal" aria-hidden="true"></i>Fatal</span>
<span><i class="dot serious" aria-hidden="true"></i>Serious injury</span>
</div>
<select id="mode-filter" class="mode-filter" aria-label="Filter crashes by pedestrian or bicycle involvement">
<option value="all">All modes</option>
<option value="pedestrian">Pedestrians</option>
<option value="bicycle">Bicycles</option>
</select>
</div>
</header>
<div class="source-credit">Source: <a href="https://opendata-geospatialdenver.hub.arcgis.com/">Denver Open Data</a> · Fatal and serious-injury crashes only · <a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a></div>
<div class="map-credit"><a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a></div>
