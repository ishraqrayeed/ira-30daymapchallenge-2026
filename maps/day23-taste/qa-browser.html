<!doctype html><html lang="en"><meta charset="utf-8"><title>Day 23 local browser checks</title><style>body{background:#111917;color:#eed8b3;font:14px monospace;margin:15px}iframe{border:1px solid #777;width:1280px;height:800px;display:block;margin-bottom:20px}#mobile{width:390px;height:844px}pre{white-space:pre-wrap}button{padding:10px}</style><h1>Day 23 browser checks</h1><p id="status">Running…</p><pre id="report"></pre><iframe id="desktop" src="map.html" title="Desktop preview"></iframe><iframe id="mobile" src="map.html" title="Mobile preview"></iframe><script>
const reports=[],errors=[];function check(value,name){reports.push({test:name,passed:!!value});if(!value)errors.push(name)}function change(w,id,value){const e=w.document.getElementById(id);e.value=value;e.dispatchEvent(new Event('change'))}function click(w,query){w.document.querySelector(query).click()}const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function wait(fn){for(let i=0;i<120;i++){if(fn())return;await sleep(100)}throw Error('Timed out waiting for UI')}
(async()=>{try{const desktop=document.getElementById('desktop'),mobile=document.getElementById('mobile');await wait(()=>desktop.contentWindow.Day23&&mobile.contentWindow.Day23);const w=desktop.contentWindow,m=mobile.contentWindow;await sleep(1000);check(w.Day23.map.queryRenderedFeatures({layers:['places']}).every(f=>typeof f.id==='string'&&w.Day23.places.some(p=>p.id===f.id)),'rendered features retain restaurant IDs');check(w.Day23.places.length===22,'22 restaurant features');check(w.document.querySelectorAll('.category').length===9,'all eight categories plus All Food');check(w.Day23.map.queryRenderedFeatures({layers:['places']}).length===22,'all 22 map circles rendered in desktop viewport');check(m.Day23.map.queryRenderedFeatures({layers:['places']}).length===22,'all 22 map circles rendered in mobile viewport');check(w.Day23.map.getPaintProperty('background','background-color')==='#F4F5F3','bright monochrome land');check(w.Day23.map.getPaintProperty('water','fill-color')==='#E3EAED','pale water style');check(m.document.documentElement.scrollWidth===390,'mobile has no horizontal overflow');
for(const c of ['biryani','morog','khichuri','bhaat','kebab','drinks','desserts','snacks']){click(w,`[data-category="${c}"]`);check(w.Day23.matching.length>0,c+' category has supported places')}
click(w,'#reset');change(w,'neighborhood','Shankhari Bazar');check(w.Day23.matching.length===0,'neighborhood with no curated places does not invent destinations');click(w,'#reset');change(w,'dish','Bhuna Khichuri');check(w.Day23.matching.length===2,'bhuna khichuri filter uses curated relationships');change(w,'dish','');change(w,'neighborhood','Nazira Bazar');check(w.Day23.matching.length===3,'neighborhood filter counts curated places');click(w,'#reset');
change(w,'place','nanna');await wait(()=>w.Day23.map.queryRenderedFeatures({layers:['selected-icons']}).some(f=>f.properties.id==='nanna'));check(true,'selected restaurant white icon rendered');check(w.Day23.map.getFeatureState({source:'restaurants',id:'nanna'}).selected===true,'selected marker feature state');check(w.document.querySelector('#panel h2').textContent==='Nanna Biryani','restaurant details reflect selected place');click(w,'#panel .primary');change(w,'place','beauty');click(w,'#panel .primary');click(w,'#trail-toggle');await wait(()=>w.Day23.state.route||w.Day23.state.routeError);check(!!w.Day23.state.route,'worker returns a pedestrian route');check(w.Day23.state.route?.metres>100,'walking distance returned');check(w.Day23.state.trail.join(',')==='nanna,beauty','trail order maintained');check(w.document.querySelector('.route-summary')?.textContent.includes('min'),'route distance and duration shown');
const before=w.Day23.state.route?.metres;click(w,'[aria-label="Move earlier Beauty Lacchi & Faluda"]');await wait(()=>w.Day23.state.route||w.Day23.state.routeError);check(w.Day23.state.trail.join(',')==='beauty,nanna','reorder stops');check(Math.abs(w.Day23.state.route.metres-before)<1,'bidirectional reverse distance consistent');
click(w,'[aria-label="Remove stop Nanna Biryani"]');check(w.Day23.state.trail.length===1&&!w.Day23.state.route,'removing stop clears obsolete route');click(w,'#reset');check(!w.Day23.state.selected&&w.Day23.state.trail.length===0&&w.Day23.matching.length===22,'reset restores full experience');
change(m,'place','haji');check(m.document.querySelector('#panel h2').textContent==='Haji Biryani','mobile card opens');const p=m.document.getElementById('panel').getBoundingClientRect();check(p.left>=0&&p.right<=390&&p.bottom<m.innerHeight-220,'mobile bottom sheet stays above filters');click(m,'#reset');await sleep(1200);
for(const [name,x] of [['desktop',w],['mobile',m]]){const ds=x.document.querySelector('.discovery').getBoundingClientRect(),hdr=x.document.querySelector('.editorial').getBoundingClientRect();reports.push({viewport:name,width:x.innerWidth,height:x.innerHeight,zoom:x.Day23.map.getZoom(),headerBottom:hdr.bottom,discoveryTop:ds.top,points:x.Day23.places.map(f=>({id:f.id,...x.Day23.map.project(f.geometry.coordinates)})),mapErrors:x.Day23.state.errors});check(x.Day23.places.every(f=>{const p=x.Day23.map.project(f.geometry.coordinates);return p.x>=20&&p.x<=x.innerWidth-20&&p.y>80&&p.y<ds.top-15}),name+' all locations stay clear of bottom controls');check(x.Day23.state.errors.length===0,name+' no MapLibre or runtime errors')}
}catch(e){errors.push(e.stack)}document.getElementById('status').textContent=errors.length?'FAIL: '+errors.join('; '):'PASS — all browser checks';document.getElementById('report').textContent=JSON.stringify(reports,null,2);fetch('http://127.0.0.1:8015/__qa',{method:'POST',body:JSON.stringify({reports,errors})}).catch(()=>{})})();</script></html>
