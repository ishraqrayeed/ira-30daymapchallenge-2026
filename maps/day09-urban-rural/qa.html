<!doctype html><meta charset="utf-8"><title>Day 9 refinement QA</title><style>body{margin:0;background:#171c20;color:#f1e9dc;font:12px system-ui}#bar{padding:8px}button{padding:8px}iframe{width:100%;height:85vh;border:0}pre{white-space:pre-wrap;max-height:220px;overflow:auto}</style><div id="bar"><button id="run">Run refinement checks</button><button id="mobile">Mobile layout</button><pre id="out">Separate QA page. The deliverable is map.html.</pre></div><iframe src="map.html?v=refine1"></iframe><script>
const frame=document.querySelector('iframe'),out=document.querySelector('#out'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const wait=async(fn,limit=180000)=>{const start=performance.now();while(!fn()){if(performance.now()-start>limit)throw Error('Timed out');await sleep(50);}};
document.querySelector('#mobile').onclick=()=>{frame.style.cssText='width:390px;height:740px';out.hidden=true;frame.contentWindow.location.reload();};
document.querySelector('#run').onclick=async()=>{const results=[];const report=(name,pass)=>{results.push({name,pass});out.textContent=JSON.stringify(results,null,2);if(!pass)throw Error(name);};try{
 await wait(()=>frame.contentWindow.day09?.ready);const w=frame.contentWindow,d=w.document,q=w.day09,C=w.Cesium,point=()=>C.Cartesian3.clone(q.viewer.camera.positionWC),equal=p=>C.Cartesian3.distance(p,q.viewer.camera.positionWC)<.001;
 report('Compare opens without runtime errors',q.comparing&&q.errors.length===0);
 report('Both periods use 45% opacity',q.layers[0].footprint.alpha===.45&&q.layers.at(-1).footprint.alpha===.45);
 report('Dynamic multiplier uses GIS outputs',Math.abs(q.multiplier-q.data.series.at(-1).developed_km2/q.data.series[0].developed_km2)<1e-10&&d.querySelector('#area').textContent==='2.9× GROWTH');
 d.querySelector('#compare').value=70;d.querySelector('#compare').dispatchEvent(new Event('input'));report('Swipe clips at requested position',Math.abs(q.viewer.scene.splitPosition-.7)<.001);d.querySelector('#compare').value=50;d.querySelector('#compare').dispatchEvent(new Event('input'));
 // A changed user camera must survive mode switching, preparation, growth, and reset.
 q.viewer.camera.moveRight(750);const original=point();d.querySelector('#growth').click();report('Growth mode preserves camera',!q.comparing&&equal(original));d.querySelector('#comparison').click();report('Compare mode preserves camera',q.comparing&&equal(original));
 await q.actions.start();await wait(()=>q.progress>.15);q.actions.pause();const frozen=q.progress;await sleep(350);report('Pause freezes timeline',q.progress===frozen);q.actions.resume();await wait(()=>!q.running);report('All ten source epochs reach 2020',q.index===9&&q.progress===1&&d.querySelector('#year').textContent==='2020');report('Camera stationary through preparation and growth (drift '+C.Cartesian3.distance(original,q.viewer.camera.positionWC).toFixed(4)+' m)',equal(original));report('Final multiplier and values match GIS',d.querySelector('#area').textContent==='2.9× GROWTH'&&d.querySelector('#change').textContent==='289.4 km² → 836.6 km²');
 d.querySelector('#record').click();report('Recording hides controls and retains year/stat',w.getComputedStyle(d.querySelector('.panel')).display==='none'&&!d.querySelector('#growth-year').hidden&&w.getComputedStyle(d.querySelector('.stats')).display!=='none');
 d.dispatchEvent(new KeyboardEvent('keydown',{code:'KeyR',bubbles:true}));await wait(()=>q.running);await wait(()=>q.progress>.05);d.dispatchEvent(new KeyboardEvent('keydown',{code:'Space',bubbles:true}));report('Recording R replays and Space pauses',q.paused&&!q.running);d.dispatchEvent(new KeyboardEvent('keydown',{code:'Space',bubbles:true}));report('Recording Space resumes',q.running);await wait(()=>!q.running);
 d.dispatchEvent(new KeyboardEvent('keydown',{code:'Escape',bubbles:true}));report('Escape exits recording',!d.body.classList.contains('recording'));d.querySelector('#reset').click();report('Reset restores 1975 without moving camera',q.index===0&&!q.running&&equal(original));d.querySelector('#epoch').value=4;d.querySelector('#epoch').dispatchEvent(new Event('input'));report('Manual source epoch selection',q.index===4&&d.querySelector('#year').textContent==='1995');q.actions.compare();report('Return to swipe keeps camera and clipping',q.comparing&&equal(original)&&q.viewer.scene.splitPosition===.5);report('No runtime or render errors',q.errors.length===0);
 out.textContent='PASS — '+results.length+' checks\n'+JSON.stringify(results,null,2);document.title='PASS — Day 9 refinement QA';window.qaResults=results;
 }catch(e){out.textContent='FAIL '+e.message+'\n'+out.textContent;document.title='FAIL — Day 9 refinement QA';}};
</script>
