<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where America Learns to Play Soccer</title>
<style>
:root{color:#193B30;background:#F6F2E7;font:16px/1.35 system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:clamp(10px,2.2vw,34px);gap:5px}
h1,h2,h3{font-family:Georgia,serif;font-weight:normal;margin:0}
h1{font-size:clamp(1.54rem,4.2vw,3.6rem);line-height:1.03;letter-spacing:-.025em}
.kicker{margin:0 0 .38rem;font-size:clamp(.69rem,1.2vw,.8rem);font-weight:600;letter-spacing:.09em}

.deck{margin:.22rem 0 0;font-size:clamp(.76rem,1.45vw,1rem);color:#193B30}
h2{font-size:1.45rem}
h3{font-size:1.13rem}
p{margin:.25rem 0}
a{color:#246447;text-underline-offset:.17em}
button{font:inherit;color:inherit;background:#F6F2E7;border:1px solid #C5BEAD;border-radius:3px;padding:.28rem .60rem;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #28694d;outline-offset:2px}
header{padding-bottom:3px}
main{position:relative;min-height:0;display:grid;grid-template-rows:minmax(0,1fr)}
.plate{position:relative;min-height:0}
#map{height:100%;width:100%}
#lead-note{position:absolute;top:6px;right:0;width:clamp(102px,16.5%,178px);margin:0;color:#1D503D;font:clamp(.75rem,1.35vw,1.04rem)/1.25 Georgia,serif;pointer-events:none}
#lead-note[hidden]{display:none}
@media(max-width:680px){#lead-note{top:max(6px,calc(50% - 42vw))}#map svg text{font-size:23px}}
.dribbling-engraving{position:absolute;left:4.7%;bottom:1.5%;width:clamp(280px,25vw,380px);max-height:38%;object-fit:contain;object-position:left bottom;pointer-events:none}
@media(max-width:680px){.dribbling-engraving{left:8%;bottom:6%;width:clamp(108px,32vw,148px);max-height:21%}}
@media(max-height:580px){.dribbling-engraving{max-height:15%;bottom:1%}}
#map svg{display:block;width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;cursor:grab}
#map svg:focus-visible{outline:1px solid #1D503D;outline-offset:-1px}
#map svg.dragging{cursor:grabbing}
#map svg.dragging .hex-hit{cursor:grabbing}
.hex-hit{cursor:pointer;outline:none}
.cell-outline{stroke:none;vector-effect:non-scaling-stroke}
.cell:has(.hex-hit:is(:focus-visible,[aria-pressed=true]))>.cell-outline{stroke:#173e30;stroke-width:1.3}
@media(hover:hover){svg:not(.dragging) .cell:has(.hex-hit:hover)>.cell-outline{stroke:#173e30;stroke-width:1.3}}
#tooltip{position:absolute;z-index:2;pointer-events:none;background:#F6F2E7;color:#193B30;border:1px solid #b9b09c;border-radius:4px;padding:.3rem .5rem;font-size:.78rem;white-space:nowrap;box-shadow:0 2px 8px #30271719}
#tooltip[hidden]{display:none}
footer{display:grid;gap:4px;font-size:clamp(.74rem,1.35vw,.87rem)}
#source{margin:0;font-size:clamp(.71rem,1.1vw,.8rem)}
#legend{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.legend-item{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.swatch{width:.9em;height:.9em;background:var(--color);border:1px solid #C5BEAD;display:inline-block}
aside{position:absolute;z-index:3;inset:8px 0 8px auto;width:min(340px,36%);max-height:100%;border:1px solid #cfc7b7;background:#F6F2E7;border-radius:8px;box-shadow:0 5px 22px #30271724;display:flex;flex-direction:column;overflow:hidden}
aside[hidden]{display:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:.75rem;border-bottom:1px solid #d3c9b7}
#details{overflow:auto;overscroll-behavior:contain;min-height:0;padding:0 .8rem;touch-action:pan-y}
#details section{padding:.65rem 0}
#details section+section{border-top:1px solid #d3c9b7}
#details p{font-size:.86rem}
@media(max-width:680px){aside{inset:auto 0 0;width:100%;height:min(51dvh,86%);border-radius:10px 10px 5px 5px}}
</style>
<script src="reveal.js" defer></script>
</head>
<body>
<header>
<p class="kicker">30 Day Map Challenge 2026 · Day 20 — Hexagons</p>
<h1>Where America Learns to Play Soccer</h1>
<p class="deck" id="subtitle"></p>
</header>
<main>
<div class="plate">
<div id="map" aria-busy="true"><p>Loading the U.S. map…</p></div>
<p id="lead-note" hidden></p>
<img class="dribbling-engraving" src="dribbling-engraving.png" alt="" draggable="false">
<div id="tooltip" role="tooltip" hidden></div>
<aside id="panel" aria-labelledby="panel-title" hidden>
<div class="panel-head"><h2 id="panel-title">Listed clubs</h2><button type="button" id="close">Close</button></div>
<div id="details"></div>
</aside>
</div>
</main>
<footer>
<div id="legend" aria-label="Map legend"></div>
<p id="source">US Club Soccer directory · H3 resolution 3 · Listed addresses may include offices.</p>

</footer>
</body>
</html>
