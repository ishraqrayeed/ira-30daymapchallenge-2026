<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>What Messi Saw · 1080 × 1350 poster</title>
<style>
:root{--paper:#f7f8f7;--ink:#282d30;--green:#dce3d8;--marking:#839087;--blue:#75aadb;--graphite:#4d5c60;--goal:#354247;--secondary:#65716f}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);min-height:100svh;display:grid;place-items:center}
.artboard{display:block;width:min(1080px,100vw,80svh);max-width:1080px;height:auto;aspect-ratio:4/5;margin:0 auto;background:var(--paper)}
text{font-family:'Courier New',monospace;fill:var(--ink)}.day{font-size:22px;font-weight:500;letter-spacing:2px}.headline{font-family:Georgia,'Times New Roman',serif;font-size:82px;font-weight:400;letter-spacing:-3px}.saw{fill:#39789f}.subtitle{font-family:Georgia,'Times New Roman',serif;font-size:30px;font-style:italic;font-weight:400}.context{font-size:23px;font-weight:400;fill:var(--secondary)}.stat-value{font-family:Georgia,'Times New Roman',serif;font-size:70px;font-weight:400;letter-spacing:-2px}.stat-label{font-size:22px;font-weight:500;letter-spacing:.3px}
.field{fill:var(--green)}.pitch-line{fill:none;stroke:var(--marking);stroke-width:.65;stroke-opacity:.63}.pitch-outer-vertical{stroke-opacity:.47}.goal-frame{fill:none;stroke:var(--goal);stroke-width:1.5}.goal-mouth{stroke:var(--goal);stroke-width:1.8}.goalpost{fill:var(--goal);stroke:var(--paper);stroke-width:.65;r:4.2px}.penalty-spot{fill:var(--marking)}.goal-label{font-size:20px;font-weight:400;letter-spacing:.4px;fill:var(--secondary)}
.sight-line{fill:none;stroke:var(--graphite);stroke-width:.45;stroke-opacity:.14}.goal .sight-line{stroke:var(--graphite);stroke-width:.65;stroke-opacity:.28}.hero .sight-line{stroke:var(--graphite);stroke-width:.95;stroke-opacity:.78}.cone{fill:var(--graphite);opacity:.018}.cone-2{opacity:.01}.shot-dot{fill:#6e7b76;stroke:var(--green);stroke-width:.5}.goal .shot-dot{fill:var(--blue);stroke:var(--paper);stroke-width:.7}.penalty-ring{fill:none;stroke:var(--secondary);stroke-width:.45;opacity:.7}.hit-target{fill:transparent}.marker{cursor:pointer;outline:none}.marker:focus-visible .hit-target{stroke:var(--ink);stroke-width:1}.hero-ring{fill:none;stroke:var(--graphite);stroke-width:1;opacity:.7}.leader{fill:none;stroke:var(--graphite);stroke-width:1;opacity:.7}.callout-value{font-family:Georgia,'Times New Roman',serif;font-size:70px;font-weight:400;letter-spacing:-2px}.callout-label{font-size:24px;font-weight:500;letter-spacing:-.2px}.callout-detail{fill:var(--secondary);font-size:23px;font-weight:400}
.legend{font-size:22px;font-weight:400;fill:var(--secondary)}.explanation{font-family:Georgia,'Times New Roman',serif;font-size:23px;font-weight:400}.source{font-size:18px;font-weight:400;fill:#78817e}.source a{fill:inherit}.tooltip{position:fixed;z-index:10;pointer-events:none;max-width:280px;padding:16px 18px;background:#f7f8f7f7;color:var(--ink);border:1px solid #8ca698;font:400 13px/1.6 Arial,sans-serif}.tooltip strong{display:block;margin-bottom:7px}.tooltip .metrics{color:var(--graphite);margin-top:7px}.tooltip[hidden]{display:none}
svg.inspecting .shot:not(.selected){opacity:.17}svg.inspecting .cone:not(.selected){opacity:.006}svg.inspecting .selected .sight-line{stroke-width:1.3;stroke-opacity:1}svg.inspecting .annotation{opacity:.3}svg.inspecting .annotation.selected{opacity:1}.selected.cone{opacity:.05}
@media print{@page{size:1080px 1350px;margin:0}body{width:1080px;height:1350px}.artboard{width:1080px;max-width:none}.tooltip{display:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<svg id="pitch" class="artboard" width="1080" height="1350" viewBox="0 0 1080 1350" role="group" aria-labelledby="poster-title poster-description">
<title id="poster-title">What Messi Saw · Day 05 — Sight</title>
<desc id="poster-description">All 35 Messi shots at the 2026 World Cup. Blue marks are goals; muted gray-green marks are other attempts. Each shot connects to both goalposts. Three annotations show the widest view, narrowest view and longest goal. Summary medians exclude two penalties at the same location.</desc>
<rect width="1080" height="1350" fill="#f7f8f7"/>
<text class="day" text-anchor="middle" x="540" y="50">DAY 05 · SIGHT</text>
<text class="headline" text-anchor="middle" x="540" y="132">WHAT MESSI <tspan class="saw">SAW</tspan></text>
<text class="subtitle" text-anchor="middle" x="540" y="171">Every shot begins with an angle.</text>
<text class="context" text-anchor="middle" x="540" y="207">Lionel Messi · Argentina · FIFA World Cup 2026</text>
<text class="stat-value" text-anchor="middle" x="223" y="290">@@SHOTS@@</text><text class="stat-label" text-anchor="middle" x="223" y="324">SHOTS</text>
<text class="stat-value" text-anchor="middle" x="540" y="290">@@MEDIAN_ANGLE@@°</text><text class="stat-label" text-anchor="middle" x="540" y="324">MEDIAN VIEW</text>
<text class="stat-value" text-anchor="middle" x="857" y="290">@@MEDIAN_DISTANCE@@<tspan font-size="42" letter-spacing="0" dx="8">m</tspan></text><text class="stat-label" text-anchor="middle" x="857" y="324">MEDIAN DISTANCE</text>
<text class="goal-label" text-anchor="middle" x="540" y="367">7.32 m · TWO POSTS</text>
@@GEOMETRY@@
<g class="legend-row" transform="translate(167 0)">
<circle cx="72" cy="1207" r="7" fill="#75aadb"/>
<text class="legend" x="92" y="1214">Goal</text>
<circle cx="225" cy="1207" r="6" fill="#6e7b76"/>
<text class="legend" x="245" y="1214">Other attempt</text>
<line x1="505" y1="1207" x2="537" y2="1207" stroke="#4d5c60" stroke-width="1.3"/>
<text class="legend" x="549" y="1214">Sight line</text>
</g>
<text class="explanation" text-anchor="middle" x="540" y="1266">Each shot connects to both posts.</text>
<text class="explanation" text-anchor="middle" x="540" y="1296">The opening between them is its view of goal.</text>
<text class="source" text-anchor="middle" x="540" y="1330">Source: <a href="https://github.com/nlbair/wc2026-events">WhoScored / Noah Bair</a> · Medians exclude penalties</text>
</svg>
<div id="tooltip" class="tooltip" role="status" aria-live="polite" hidden></div>
<script>@@SCRIPT@@</script>
</body>
</html>
