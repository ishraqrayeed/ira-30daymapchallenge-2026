<!doctype html><html lang="en"><meta charset="utf-8"><title>Day 24 road-trip browser checks</title><style>body{font:13px monospace;background:#F7F5ED;color:#243443;margin:10px}h1{font-size:18px}pre{white-space:pre-wrap}iframe{display:block;width:1280px;height:800px;border:1px solid #ABB2A9}details{margin:12px 0}</style><h1>Day 24 local browser checks</h1><p id="status">Running…</p><details><summary>Results</summary><pre id="report"></pre></details><iframe id="frame" src="map.html" title="Game test viewport"></iframe><script>
const results=[],errors=[],frame=document.getElementById('frame'),keys=['road-trip-personal-bests-v1','road-trip-personal-best-v2'],backups=Object.fromEntries(keys.map(k=>[k,localStorage.getItem(k)]));const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function wait(fn,label='UI update'){for(let i=0;i<400;i++){if(fn())return;await sleep(100)}throw Error('Timeout: '+label)}function check(value,name){results.push({name,passed:!!value});if(!value)errors.push(name)}let w;
function click(id){w.document.getElementById(id).click()}function highway(target,reference){const map=w.RoadTrip.map,features=map.queryRenderedFeatures({layers:['interstates','highway-context']});let best=null;function scan(c){if(typeof c[0]==='number'){const d=(c[0]-target[0])**2+(c[1]-target[1])**2;if(!best||d<best.d)best={d,c}}else c.forEach(scan)}for(const f of features)if(f.properties.ref.includes(reference))scan(f.geometry.coordinates);if(!best)throw Error('No rendered highway matching '+reference);const p=map.project(best.c);map.fire('click',{point:p,lngLat:new w.maplibregl.LngLat(...best.c),originalEvent:new w.MouseEvent('click')})}
function snapshot(){const s=w.RoadTrip.state;return JSON.stringify({stops:s.stops,result:s.result,history:s.history.length,revision:s.revision,pins:w.RoadTrip.markers.map(m=>[m.getLngLat().lng,m.getLngLat().lat]),states:w.document.getElementById('state-score').textContent,miles:w.document.getElementById('mile-score').textContent,left:w.document.getElementById('remaining-score').textContent,passport:[...w.document.querySelectorAll('.passport-grid .stamped')].map(n=>n.dataset.state),best:w.localStorage.getItem('road-trip-personal-best-v2')})}
async function settled(){await wait(()=>!w.RoadTrip.state.busy,'route validation');await sleep(100)}
(async()=>{try{await wait(()=>frame.contentWindow.RoadTrip?.state.ready,'game ready');w=frame.contentWindow;await sleep(800);const s=w.RoadTrip.state;check(w.RoadTrip.workerStats.states===48,'unchanged graph reaches all 48 states');check(!w.document.getElementById('modes')&&!('mode' in s),'all challenge selection and mode state removed');check(w.document.querySelectorAll('.score-row .metric').length===4&&!w.document.getElementById('time-score'),'four metrics, no driving-time counter');check(w.RoadTrip.map.queryRenderedFeatures({layers:['interstates']}).length>0,'actual highways render');const board=w.document.querySelector('.scoreboard').getBoundingClientRect();const extremes=[[-124.73,48.38],[-117.12,32.53],[-80.09,24.55],[-66.98,44.8]].map(c=>({coordinate:c,point:w.RoadTrip.map.project(c)}));results.push({desktop:{width:w.innerWidth,height:w.innerHeight,gameHeight:w.document.getElementById('game').clientHeight,boardTop:board.top,padding:w.RoadTrip.map.getPadding(),extremes}});check(extremes.every(e=>e.point.x>15&&e.point.x<w.innerWidth-15&&e.point.y>125&&e.point.y<board.top-10),'continental extremes are visible above scoreboard');check(w.RoadTrip.map.queryRenderedFeatures({layers:['interstate-shields']}).length>0,'verified Interstate shields render');check(w.document.fonts.check('700 20px "Barlow Condensed"'),'local vintage heading font loaded');
click('reset-best');highway([-104.995,39.778],'I 70');await wait(()=>s.stops.length===1&&!s.busy,'start');check(s.result.centimetres===0&&s.result.states.length===0,'unrouted start counts zero miles and states');highway([-95.67,39.06],'I 70');await wait(()=>s.stops.length===2&&!s.busy,'valid second stop');check(s.result.states.includes('CO')&&s.result.centimetres>100*w.RoadTripCore.CM_PER_MILE,'valid second stop follows real highway route');highway([-94.57,39.12],'I 70');await wait(()=>s.stops.length===3&&!s.busy,'valid third stop');check(s.result.centimetres<=w.RoadTripCore.MAX_DISTANCE_CM,'several stops remain within budget');check(!!JSON.parse(w.localStorage.getItem('road-trip-personal-best-v2')),'personal best saved for an accepted trip');
click('passport');check(w.document.querySelectorAll('#passport-grid li').length===48,'passport contains exactly 48 states');check(w.document.querySelectorAll('#passport-grid .stamped').length===new Set(s.result.states).size,'passport matches the route state set');click('close-passport');let before=snapshot();highway([-73.92,40.84],'I 95');await settled();check(snapshot()===before,'over-budget addition changes no accepted route, pin, counter, history or record');check(w.document.querySelector('#notice strong').textContent==='OUT OF MILES!','budget warning is nonblocking and visible');
let pin=w.RoadTrip.markers[0];pin.fire('dragstart');pin.setLngLat([-118.24,34.058]);pin.fire('dragend');await settled();check(snapshot()===before,'invalid drag restores accepted position and all scores');
click('itinerary');w.document.querySelector('[aria-label="Move earlier 3"]').click();await settled();check(s.result.centimetres<=w.RoadTripCore.MAX_DISTANCE_CM,'reordering is validated');const reordered=snapshot();w.document.querySelector('[aria-label="Move earlier 2"]').click();await settled();check(snapshot()===reordered,'over-budget reorder is rejected without a new history entry');click('undo');await settled();check(s.stops[0].coordinate[0]<-100,'undo restores accepted order');
click('itinerary');if(w.document.getElementById('route-panel').hidden)click('itinerary');w.document.querySelector('[aria-label="Insert stop after 1"]').click();highway([-97.6,38.86],'I 70');await settled();check(s.stops.length===4&&s.result.centimetres<=w.RoadTripCore.MAX_DISTANCE_CM,'intermediate insertion uses the same budget validation');check(new Set(s.result.states).size===s.result.states.length,'revisited states count only once');
const realRoute=w.RoadTrip.trip.route;before=snapshot();w.RoadTrip.trip.route=async()=>{throw Error('Test: no permitted highway path.')};highway([-95.4,39.02],'I 70');await settled();check(snapshot()===before,'routing failures preserve the accepted trip');w.RoadTrip.trip.route=realRoute;
click('itinerary');if(w.document.getElementById('route-panel').hidden)click('itinerary');w.document.querySelector('[aria-label="Delete stop 2"]').click();await settled();check(s.stops.length===3&&s.result.centimetres<=w.RoadTripCore.MAX_DISTANCE_CM,'removing a stop remains allowed');click('undo');await settled();check(s.stops.length===4,'undo restores a validated stop insertion');
const future=w.addAt([-73.92,40.84]);click('clear-top');await future;await settled();check(s.stops.length===0&&s.result.centimetres===0,'clear cancels pending work without ghost stops');check(w.document.querySelectorAll('#passport-grid .stamped').length===0,'clear resets passport');click('help');check(!w.document.getElementById('help-panel').hidden,'How to Play opens');w.document.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));check(w.document.getElementById('help-panel').hidden,'Escape closes help');
frame.style.width='390px';frame.style.height='844px';await sleep(1000);check(w.innerWidth===390&&w.document.documentElement.scrollWidth===390,'mobile has no horizontal overflow');check(w.document.querySelector('.scoreboard').getBoundingClientRect().right<=390,'mobile scoreboard fits');check(w.document.getElementById('passport').getBoundingClientRect().height>=40,'passport control has a comfortable touch target');check(w.RoadTrip.map.queryRenderedFeatures({layers:['states']}).length>=40,'mobile map renders the country');check(s.errors.length===0,'no map or runtime errors');results.push({runtimeErrors:s.errors,graph:w.RoadTrip.workerStats,mobile:{width:w.innerWidth,height:w.innerHeight}});
}catch(e){errors.push(e.stack)}finally{for(const key of keys){const value=backups[key];if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value)}document.getElementById('status').textContent=errors.length?'FAIL: '+errors.join('; '):'PASS — all browser checks';document.getElementById('report').textContent=JSON.stringify(results,null,2);fetch('http://127.0.0.1:8017/__qa',{method:'POST',body:JSON.stringify({results,errors})}).catch(()=>{})}})();
</script></html>
