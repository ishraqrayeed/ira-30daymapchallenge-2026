const svg=document.getElementById('map'),tooltip=document.getElementById('tooltip'),isStatic=document.body.classList.contains('static');
const stats=Object.fromEntries(MAP_DATA.stats.map(s=>[s.minutes,s]));
function hideTip(){tooltip.hidden=true;for(const p of document.querySelectorAll('.catchment'))p.classList.remove('active');}
function tip(event,title,detail){tooltip.replaceChildren();const strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=title;small.textContent=detail;tooltip.append(strong,small);tooltip.hidden=false;tooltip.style.left=Math.max(8,Math.min(event.clientX+12,window.innerWidth-258))+'px';tooltip.style.top=Math.max(8,Math.min(event.clientY-65,window.innerHeight-85))+'px';}
if(!isStatic){for(const button of document.querySelectorAll('.legend button')){button.addEventListener('click',()=>{const on=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(on));document.querySelector('.band-'+button.dataset.minutes).style.display=on?'':'none';hideTip();});}
for(const path of document.querySelectorAll('.catchment')){const s=stats[path.dataset.minutes],show=event=>{hideTip();tip(event,`${s.minutes===15?"Up to 15":(s.minutes-15)+"–"+s.minutes} min display band`,`${s.area_km2.toFixed(1)} km² cumulative modeled envelope · ${s.reachable_stations} rail-reachable stations by ${s.minutes} min`);path.classList.add('active');};path.addEventListener('pointermove',show);path.addEventListener('click',show);path.addEventListener('pointerleave',hideTip);}
for(const marker of document.querySelectorAll('.station')){const s=MAP_DATA.stations.find(s=>s.station_name===marker.dataset.station),show=e=>tip(e,s.station_name,`${s.metro_minutes_from_farmgate.toFixed(1)} estimated metro min from Farmgate · exit/walking additional`);marker.addEventListener('pointermove',show);marker.addEventListener('click',show);marker.addEventListener('pointerleave',hideTip);}}
function resize(){const r=svg.getBoundingClientRect(),scale=Math.min(r.width/MAP_DATA.width,r.height/MAP_DATA.height);document.getElementById('scale-bar').style.width=(MAP_DATA.scale2km*scale)+'px';for(const label of svg.querySelectorAll('.origin-label,.end-label'))label.style.fontSize=((label.classList.contains('origin-label')?9.2:9)/scale)+'px';hideTip();}
new ResizeObserver(resize).observe(svg);resize();document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip();});
</script></body></html>
